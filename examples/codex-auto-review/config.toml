# Ejemplo educativo personal para desarrollo y evaluación de agentes.
# No es una política corporativa. No contiene credenciales ni destinos internos.
# Este archivo NO está activo mientras permanezca en examples/.
# Requiere un cliente compatible y que los requisitos administrados lo permitan.

model_reasoning_effort = "medium"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "agent-lab"

# No combinar con sandbox_mode / sandbox_workspace_write en otras capas.
# El proxy es necesario para que se apliquen los dominios del perfil.
[features]
network_proxy = true

[permissions.agent-lab]
description = "Desarrollo local y evaluaciones sintéticas con destinos públicos acotados."
extends = ":workspace"

[permissions.agent-lab.filesystem]
":root" = "deny"
":minimal" = "read"
# La herencia conserva escritura en workspace y temporales y las protecciones
# de .git, .agents, .codex y .aws. Herramientas fuera de :minimal pueden requerir
# excepciones locales precisas (por ejemplo, una instalación de Python).

[permissions.agent-lab.filesystem.":workspace_roots"]
".env" = "deny"
".env.local" = "deny"
".env.production" = "deny"
"secrets" = "deny"
# No es una detección universal de secretos: hay que gestionar otros archivos
# y las variables de entorno por separado. No colocar secretos en el workspace.

[permissions.agent-lab.network]
enabled = true

[permissions.agent-lab.network.domains]
"api.openai.com" = "allow"
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"registry.npmjs.org" = "allow"
# Los dominios son ejemplos públicos. Conservar solo los realmente usados.
# No habilitar "*", redes internas o sockets Docker de forma general.

